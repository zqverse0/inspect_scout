[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sounding"
version = "0.1.0"
description = "Berth session analysis: inspect_scout single-transcript scanning plus Jev per-item judging."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anyio>=4",
    "jinja2>=3",
    "jsonschema>=4",
    "pydantic>=2.11",
    "tiktoken>=0.7",
    "typing_extensions>=4.9",
]

[project.scripts]
sounding = "sounding.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sounding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
